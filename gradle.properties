# Keep Gradle small: this machine builds several things at once.
org.gradle.jvmargs=-Xmx1g
org.gradle.daemon=false

# One version for every jar: minecraft-link-<loader>-<mod_version>.jar
mod_version=0.1.0
maven_group=dev.patodois
archives_base_name=minecraft-link
mod_id=minecraft_link
mod_name=Rewrite Link for Minecraft

minecraft_version=26.3
# Unobfuscated (Mojang names) vanilla used by the common project; https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric Properties (https://fabricmc.net/develop, https://meta.fabricmc.net)
loader_version=0.20.1
loom_version=1.19.3
fabric_api_version=0.165.0+26.3

# NeoForge (ModDevGradle)
moddev_version=2.0.148
neoforge_version=26.3.0.95

# Dependencies
link_java_version=0.1.0
