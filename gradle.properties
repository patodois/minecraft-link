# Keep Gradle small: this machine builds several things at once.
org.gradle.jvmargs=-Xmx1g
org.gradle.daemon=false

# One mod version for every jar: minecraft-link-<loader>-<minecraft_version>-<mod_version>.jar
mod_version=0.1.2
maven_group=dev.patodois
archives_base_name=minecraft-link
mod_id=minecraft_link
mod_name=Rewrite Link for Minecraft

minecraft_version=1.20.1
# Minecraft versions the metadata of every loader accepts
minecraft_version_range=[1.20.1,1.20.2)

# Fabric (https://fabricmc.net/develop, https://meta.fabricmc.net)
loader_version=0.20.1
loader_min_version=0.14.21
loom_version=1.13.6
fabric_api_version=0.92.12+1.20.1

# Forge (ForgeGradle 6: https://maven.minecraftforge.net/net/minecraftforge/gradle/ForgeGradle/)
forgegradle_version=6.0.54
forge_version=47.4.28

# NeoForge 1.20.1 (the 47.1.x fork), ModDevGradle legacy: https://projects.neoforged.net/neoforged/moddevgradle
moddev_version=2.0.148
neoforge_version=47.1.106

# Dependencies
link_java_version=0.1.3
