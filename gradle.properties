# Keep Gradle small: this machine builds several things at once.
org.gradle.jvmargs=-Xmx1g
org.gradle.daemon=false

# One mod version for every jar: minecraft-link-<loader>-<minecraft_version>-<mod_version>.jar
mod_version=0.1.2
maven_group=dev.patodois
archives_base_name=minecraft-link
mod_id=minecraft_link
mod_name=Rewrite Link for Minecraft

minecraft_version=26.3
# Unobfuscated (Mojang names) vanilla used by the common project; https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric Properties (https://fabricmc.net/develop, https://meta.fabricmc.net)
loader_version=0.20.1
# The oldest Fabric Loader the mod accepts. Quilt Loader 0.31.0-beta.4 provides 0.19.5; the code needs nothing newer.
loader_min_version=0.19.5
loom_version=1.19.3
fabric_api_version=0.165.0+26.3

# NeoForge (ModDevGradle)
moddev_version=2.0.148
neoforge_version=26.3.0.95

# Forge (ForgeGradle 7)
forgegradle_version=7.0.40
forge_jarjar_version=0.2.3
forge_version=66.1.0

# Dependencies
link_java_version=0.1.3

# ForgeGradle: put a mod's classes and resources in one directory in the dev run, so Forge sees one mod file.
net.minecraftforge.gradle.merge-source-sets=true
