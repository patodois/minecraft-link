// Shared by the loader modules (fabric, forge, neoforge): they compile the common sources and resources into
// their own jar, name it minecraft-link-<loader>-<minecraft version>-<mod version>.jar, and carry the licences.

apply plugin: 'java'

def common = rootProject.project(':common')

version = rootProject.mod_version
group = rootProject.maven_group

base {
	// The Minecraft version is in the name, so the jars of two Minecraft versions never share a file name:
	// minecraft-link-forge-1.20.1-0.1.0.jar
	archivesName = "${rootProject.archives_base_name}-${project.name}-${rootProject.minecraft_version}"
}

sourceSets.main {
	java.srcDir common.file('src/main/java')
	resources.srcDir common.file('src/main/resources')
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	// Minecraft 1.20.1 runs on Java 17; the mod is compiled for it.
	toolchain.languageVersion = JavaLanguageVersion.of(17)
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// The version (and a few names) are written into each loader's metadata file.
tasks.named('processResources') {
	def props = [
		version     : rootProject.mod_version,
		mod_id      : rootProject.mod_id,
		mod_name    : rootProject.mod_name,
		minecraft_version: rootProject.minecraft_version,
		minecraft_version_range: rootProject.minecraft_version_range,
		loader_min_version: rootProject.loader_min_version,
		forge_version: rootProject.forge_version,
		neoforge_version: rootProject.neoforge_version,
	]
	inputs.properties props
	filesMatching(['fabric.mod.json', 'META-INF/mods.toml']) {
		expand props
	}
}

tasks.named('jar') {
	def projectName = rootProject.name
	from(rootProject.file('LICENSE-MIT')) { rename { "${it}_${projectName}" } }
	from(rootProject.file('LICENSE-APACHE')) { rename { "${it}_${projectName}" } }
}

// Test clients must be silent: before every runClient write the master volume 0 into the run directory's options.txt
// (created if missing, other lines kept). The accessibility onboarding screen of a first start and the pause menu that
// appears when the window is not focused are switched off too, so scripted runs are not stuck on them, and the tutorial hints
// stay away from the screenshots.
def prepareRunOptions = tasks.register('prepareRunOptions') {
	def optionsFile = layout.projectDirectory.file('run/options.txt').asFile
	doLast {
		optionsFile.parentFile.mkdirs()
		def ours = ['soundCategory_master:0.0', 'onboardAccessibility:false', 'pauseOnLostFocus:false', 'tutorialStep:none']
		def lines = optionsFile.exists() ? optionsFile.readLines().findAll { line -> !ours.any { line.startsWith(it.split(':')[0] + ':') } } : []
		lines.addAll(ours)
		optionsFile.text = lines.join('\n') + '\n'
	}
}
tasks.matching { it.name == 'runClient' }.configureEach {
	dependsOn prepareRunOptions
	// the game runs on Java 17 whatever JDK runs Gradle
	if (it instanceof JavaExec) it.javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
