// Shared by the loader modules (fabric, neoforge, forge): they compile the common sources and resources into
// their own jar, name it minecraft-link-<loader>-<version>.jar, and carry the licences.

apply plugin: 'java'

def common = rootProject.project(':common')

version = rootProject.mod_version
group = rootProject.maven_group

base {
	archivesName = "${rootProject.archives_base_name}-${project.name}"
}

sourceSets.main {
	java.srcDir common.file('src/main/java')
	resources.srcDir common.file('src/main/resources')
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	// The only JDK this build uses is the one Gradle runs on (JDK 25); tools that ask for a toolchain get that one.
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The version (and a few names) are written into each loader's metadata file.
tasks.named('processResources') {
	def props = [
		version     : rootProject.mod_version,
		mod_id      : rootProject.mod_id,
		mod_name    : rootProject.mod_name,
		minecraft_version: rootProject.minecraft_version,
		loader_min_version: rootProject.loader_min_version,
		neoforge_version: rootProject.hasProperty('neoforge_version') ? rootProject.neoforge_version : '',
	]
	inputs.properties props
	filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml']) {
		expand props
	}
}

tasks.named('jar') {
	def projectName = rootProject.name
	from(rootProject.file('LICENSE-MIT')) { rename { "${it}_${projectName}" } }
	from(rootProject.file('LICENSE-APACHE')) { rename { "${it}_${projectName}" } }
}

// Test clients must be silent: before every runClient write the master volume 0 into the run directory's options.txt
// (created if missing, other lines kept). The accessibility onboarding screen of a first start is switched off too,
// so scripted runs are not stuck on it.
def prepareRunOptions = tasks.register('prepareRunOptions') {
	def optionsFile = layout.projectDirectory.file('run/options.txt').asFile
	doLast {
		optionsFile.parentFile.mkdirs()
		def lines = optionsFile.exists() ? optionsFile.readLines().findAll { !it.startsWith('soundCategory_master:') && !it.startsWith('onboardAccessibility:') } : []
		lines.add('soundCategory_master:0.0')
		lines.add('onboardAccessibility:false')
		optionsFile.text = lines.join('\n') + '\n'
	}
}
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn prepareRunOptions }
