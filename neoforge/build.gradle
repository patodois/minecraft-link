// NeoForge 1.20.1 (the 47.1.x fork of Forge): ModDevGradle's legacy plugin, which develops against Mojang names and reobfuscates the jar to SRG.
plugins {
	id 'net.neoforged.moddev.legacyforge'
}
apply from: rootProject.file('gradle/loader.gradle')

repositories {
	mavenCentral()
}

legacyForge {
	enable {
		neoForgeVersion = "${rootProject.minecraft_version}-${rootProject.neoforge_version}"
		disableRecompilation = true
	}

	runs {
		client {
			client()
			gameDirectory = project.file('run')
			// The Mac has 16 GB shared with other builds: keep the game small.
			jvmArguments.add '-Xmx2G'
			// Scripted runs (see AutoTest): ./gradlew :neoforge:runClient -Pautotest=/path/script.txt -Pshots=/path/dir
			if (project.hasProperty('autotest')) {
				systemProperty 'minecraftlink.autotest', project.property('autotest')
				systemProperty 'minecraftlink.shots', project.hasProperty('shots') ? project.property('shots') : 'run/shots'
			}
		}
	}

	mods {
		"${rootProject.mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// The passthrough link protocol (pure Java), built from ../link-java and bundled into the jar (jarJar). In the dev run it has to be
	// on the extra runtime classpath too: ModDevGradle only puts the game, the loader and the mods' own classes on the legacy
	// class path, and Forge's module layers do not see libraries that are not on it.
	implementation "dev.patodois:link-java:${rootProject.link_java_version}"
	additionalRuntimeClasspath "dev.patodois:link-java:${rootProject.link_java_version}"
	jarJar("dev.patodois:link-java") {
		version {
			strictly "[${rootProject.link_java_version},)"
			prefer rootProject.link_java_version
		}
	}
}
