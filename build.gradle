// Plugin versions live here once; the subprojects apply them without a version.
plugins {
	// https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml
	id 'fabric-loom' version "${loom_version}" apply false
	// https://maven.minecraftforge.net/net/minecraftforge/gradle/ForgeGradle/maven-metadata.xml
	id 'net.minecraftforge.gradle' version "${forgegradle_version}" apply false
	// https://projects.neoforged.net/neoforged/moddevgradle (the legacy plugin develops against 1.17 to 1.20.1)
	id 'net.neoforged.moddev.legacyforge' version "${moddev_version}" apply false
}
