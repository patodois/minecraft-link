plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"minecraft_link" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

loom {
	runs {
		client {
			// The Mac has 16 GB shared with other builds: keep the game small.
			vmArg "-Xmx2G"
			// Scripted runs (see AutoTest): ./gradlew runClient -Pautotest=/path/script.txt -Pshots=/path/dir
			if (project.hasProperty("autotest")) {
				property "minecraftlink.autotest", project.property("autotest")
				property "minecraftlink.shots", project.hasProperty("shots") ? project.property("shots") : "run/shots"
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The passthrough link protocol (pure Java), built from ../link-java and bundled into the jar.
	implementation "dev.patodois:link-java:${project.link_java_version}"
	include "dev.patodois:link-java:${project.link_java_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
}

test {
	useJUnitPlatform()
	maxHeapSize = "768m"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE-MIT") { rename { "${it}_$projectName" } }
	from("LICENSE-APACHE") { rename { "${it}_$projectName" } }
}
