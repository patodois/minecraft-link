name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The protocol library is an included build expected next to this repository (../link-java)
      - uses: actions/checkout@v4
        with:
          path: minecraft-link
      - uses: actions/checkout@v4
        with:
          repository: patodois/link-java
          path: link-java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      # Builds the Minecraft 1.12.2 Forge jar and runs the unit tests (the Java 8 toolchain comes from foojay)
      - name: Build and test
        working-directory: minecraft-link
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}
          path: minecraft-link/build/libs/minecraft-link-forge-1.12.2-*[0-9].jar
          if-no-files-found: error

  # Game files, decompiled or third-party code and secrets must never reach this public repository: this runs
  # tools/check_public_tree.py on the commits of the push or pull request (a new branch: all of its history).
  public-tree:
    name: Public tree (no game files, decompiled code or secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the commits of this push or pull request
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 tools/check_public_tree.py --range "$BASE..$HEAD"
          else
            python3 tools/check_public_tree.py --range "$HEAD"
          fi
