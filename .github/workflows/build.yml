name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The protocol library is a Gradle composite build expected next to this repository (../link-java).
      # Change the repository below to wherever link-java is published.
      - uses: actions/checkout@v4
        with:
          path: minecraft-link
      - uses: actions/checkout@v4
        with:
          repository: patodois/link-java
          path: link-java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # the wrapper in the repository decides the Gradle version
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Builds the Fabric (also used on Quilt), NeoForge and Forge jars and runs the 49 unit tests of the common module.
      # ModDevGradle asks for a Java 21 toolchain for some of its tools; the foojay resolver in settings.gradle fetches it.
      - name: Build all loaders and run the common tests
        working-directory: minecraft-link
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.os }}
          path: |
            minecraft-link/fabric/build/libs/minecraft-link-fabric-*[0-9].jar
            minecraft-link/neoforge/build/libs/minecraft-link-neoforge-*[0-9].jar
            minecraft-link/forge/build/libs/minecraft-link-forge-*[0-9].jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: minecraft-link/common/build/reports/tests

  # Game files, decompiled or third-party code and secrets must never reach this public repository: this runs
  # tools/check_public_tree.py on the commits of the push or pull request (a new branch: all of its history).
  public-tree:
    name: Public tree (no game files, decompiled code or secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the commits of this push or pull request
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 tools/check_public_tree.py --range "$BASE..$HEAD"
          else
            python3 tools/check_public_tree.py --range "$HEAD"
          fi
