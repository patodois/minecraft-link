name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The protocol library is a Gradle composite build expected next to this repository (../link-java).
      # Change the repository below to wherever link-java is published.
      - uses: actions/checkout@v4
        with:
          path: minecraft-link
      - uses: actions/checkout@v4
        with:
          repository: patodois/link-java
          path: link-java
      # Gradle itself runs on JDK 21 (Loom 1.13 needs it; the last version listed becomes JAVA_HOME), the game and the mod are
      # compiled for Java 17 through Gradle's toolchain, which finds the JDK 17 below (or fetches one through the foojay resolver).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # the wrapper in the repository decides the Gradle version
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Builds the Fabric, NeoForge and Forge jars and runs the unit tests of the common module.
      - name: Build all loaders and run the common tests
        working-directory: minecraft-link
        run: ./gradlew build --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_17_ARM64
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.os }}
          path: |
            minecraft-link/fabric/build/libs/minecraft-link-fabric-*[0-9].jar
            minecraft-link/neoforge/build/libs/minecraft-link-neoforge-*[0-9].jar
            minecraft-link/forge/build/libs/minecraft-link-forge-*[0-9].jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: minecraft-link/common/build/reports/tests
